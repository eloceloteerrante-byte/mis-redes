<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10100f">
  <meta name="description" content="Redes sociales de El Ocelote Errante">
  <title>El Ocelote Errante</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #10100f;
      color: #f2eee5;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 25px;
      border: 1px solid #c8a96a;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10100f;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin: 0;
      line-height: 1.25;
    }

    .divider {
      width: 55px;
      height: 2px;
      margin: 22px auto 30px;
      background: #c8a96a;
    }

    .social-links {
      display: grid;
      gap: 14px;
    }

    .social-link {
      display: block;
      padding: 18px;
      border: 1px solid #49402d;
      border-radius: 12px;
      background: #191917;
      color: #f2eee5;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .social-link:hover,
    .social-link:focus-visible {
      border-color: #c8a96a;
      background: #252117;
    }

    .social-link:focus-visible {
      outline: 2px solid #c8a96a;
      outline-offset: 3px;
    }

    footer {
      margin-top: 32px;
      color: #c8a96a;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      body {
        padding: 30px 16px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .logo {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="logo">
      <img
        src="./ocelotl.png"
        alt="Logotipo de El Ocelote Errante"
      >
    </div>

    <h1>El Ocelote Errante</h1>

    <div class="divider"></div>

    <nav class="social-links" aria-label="Redes sociales">

      <a
        class="social-link"
        href="https://www.instagram.com/el_ocelote_errante?srtk=MTMxbnVqdjZydXlkbQ=="
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a
        class="social-link"
        href="https://www.facebook.com/share/1CT6uxSkK5/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Facebook
      </a>

      <a
        class="social-link"
        href="https://www.tiktok.com/@el.ocelote.errante?_r=1&_t=ZS-9AxI8K0wRrL"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>

      <a
        class="social-link"
        href="https://youtube.com/@eloceloteerrante?si=Z8x0RQDzB0mJIR2Q"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

    </nav>

    <footer>
      Gracias por acompañar el camino.
    </footer>

  </main>
</body>
</html>
