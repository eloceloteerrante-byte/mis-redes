
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10100f">
  <meta name="description" content="Enlaces a las redes sociales de El Ocelote Errante.">
  <title>El Ocelote Errante | Redes sociales</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #10100f;
      --surface: #191917;
      --border: #353126;
      --gold: #c8a96a;
      --text: #f2eee5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          ellipse at top,
          rgba(200, 169, 106, 0.08),
          transparent 48%
        ),
        var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      width: 124px;
      height: 124px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.015);
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.8rem, 7vw, 2.35rem);
      font-weight: 600;
      letter-spacing: 0.025em;
      line-height: 1.2;
    }

    .divider {
      width: 52px;
      height: 2px;
      margin: 22px auto 30px;
      background: var(--gold);
    }

    .social-links {
      display: grid;
      gap: 13px;
    }

    .social-link {
      min-height: 58px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition:
        border-color 180ms ease,
        background-color 180ms ease,
        transform 180ms ease;
    }

    .social-link:hover {
      border-color: var(--gold);
      background: #211f19;
      transform: translateY(-2px);
    }

    .social-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .social-link:active {
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 30px 16px;
      }

      .logo {
        width: 108px;
        height: 108px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="logo">
      <img
        src="images/ocelotl.png"
        alt="Logotipo oficial de El Ocelote Errante"
      >
    </div>

    <h1>El Ocelote Errante</h1>

    <div class="divider" aria-hidden="true"></div>

    <nav class="social-links" aria-label="Redes sociales">
      <a
        class="social-link"
        href="https://www.instagram.com/el_ocelote_errante?srtk=MTMxbnVqdjZydXlkbQ=="
        target="_blank"
        rel="noopener noreferrer"
      >Instagram</a>

      <a
        class="social-link"
        href="https://www.facebook.com/share/1CT6uxSkK5/"
        target="_blank"
        rel="noopener noreferrer"
      >Facebook</a>

      <a
        class="social-link"
        href="https://www.tiktok.com/@el.ocelote.errante?_r=1&_t=ZS-9AxI8K0wRrL"
        target="_blank"
        rel="noopener noreferrer"
      >TikTok</a>

      <a
        class="social-link"
        href="https://youtube.com/@eloceloteerrante?si=Z8x0RQDzB0mJIR2Q"
        target="_blank"
        rel="noopener noreferrer"
      >YouTube</a>
    </nav>
  </main>
</body>
  </html>
